[build]
  # Netlify deploys are turned off for this repo. Exit 0 tells Netlify to skip every build.
  ignore = "exit 0"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_API_URL = "https://clipverse-backend-production.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
