name: Deploy RimSocial website to GitHub Pages
# Redeploy the latest main-branch frontend whenever this workflow changes.
# Deployment refresh requested 2026-11-06: rebuild and publish the current frontend.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Do not enable npm cache here: this monorepo has no root package-lock.json.

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build --workspace=clipverse-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://clipverse-backend-production.up.railway.app' }}

      - name: Verify frontend build output
        run: test -s frontend/dist/index.html && test -d frontend/dist/assets

      - name: Keep SPA routes working on GitHub Pages
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
