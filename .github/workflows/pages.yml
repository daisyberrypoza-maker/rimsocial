name: Deploy RimSocial website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Do not enable npm cache here: this monorepo has no root package-lock.json.

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build --workspace=clipverse-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify frontend build output
        run: test -s frontend/dist/index.html && test -d frontend/dist/assets

      - name: Keep SPA routes working on GitHub Pages
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
