name: Android Debug APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimsocial-android-apk-main
  cancel-in-progress: false

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: https://clipverse-backend-production.up.railway.app
          VITE_GIT_COMMIT: ${{ github.sha }}

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: ./node_modules/.bin/capacitor sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: rimsocial-android-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
