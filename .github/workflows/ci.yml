name: RimSocial CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rimsocial-full-feature-fixes
      - clipverse-production-fixes-2026-11-05
      - clipverse-social-experience-2026-11-05
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - rimsocial-full-feature-fixes

concurrency:
  group: rimsocial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend unit tests
        run: npm test --prefix backend -- --test-force-exit
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  business-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: rimsocial_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run Find Flip Fix MySQL integration test
        env:
          NODE_ENV: test
          JWT_SECRET: rimsocial-ci-only-jwt-secret-000000000000000000000000
          ADMIN_API_KEY: rimsocial-ci-only-admin-key-000000000000000000000000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rimsocial_test
          DB_USER: root
          DB_PASS: test-password
          DB_SYNC: "false"
          AUTO_CREATE_DATABASE: "false"
          SERVE_FRONTEND: "false"
          RUN_BUSINESS_INTEGRATION: "true"
        run: node --test --test-force-exit backend/test/business.integration.test.js


  android-capacitor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build web assets for the Capacitor shell
        run: npm run build --prefix frontend
        env:
          # A reserved invalid host is used only for compilation; no APK is published by CI.
          VITE_API_URL: https://rimsocial-ci.invalid
      - name: Sync Capacitor Android project
        working-directory: frontend
        run: ./node_modules/.bin/capacitor sync android
      - name: Assemble Android debug APK
        working-directory: frontend/android
        run: bash ./gradlew --no-daemon assembleDebug
