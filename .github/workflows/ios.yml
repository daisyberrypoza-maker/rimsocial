name: Verify RimSocial iOS and iPad build

on:
  push:
    branches: [main, 'compliance/**']
    paths:
      - 'mobile/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-build:
    name: Unsigned iOS and iPad simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure CocoaPods is installed
        run: |
          if ! command -v pod >/dev/null 2>&1; then sudo gem install cocoapods --no-document; fi
          pod --version
      - name: Generate React Native iOS project
        working-directory: ${{ runner.temp }}
        run: npx --yes @react-native-community/cli@14 init RimSocial --version 0.75.4 --package-name com.clipverse.app --pm npm --skip-install --install-pods=false --skip-git-init --directory RimSocial
      - name: Verify generated iOS project structure
        run: |
          find "$RUNNER_TEMP/RimSocial" -maxdepth 5 -name "*.xcodeproj" -print
          test -d "$RUNNER_TEMP/RimSocial/ios"
      - name: Apply app source and dependencies
        run: |
          cp mobile/App.js "$RUNNER_TEMP/RimSocial/App.js"
          cp mobile/index.js "$RUNNER_TEMP/RimSocial/index.js"
          rm -rf "$RUNNER_TEMP/RimSocial/src"
          cp -R mobile/src "$RUNNER_TEMP/RimSocial/src"
          cp mobile/package.json "$RUNNER_TEMP/RimSocial/package.json"
          node - "$RUNNER_TEMP/RimSocial/package.json" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.devDependencies = Object.assign({}, pkg.devDependencies, {
            '@react-native-community/cli': '13.6.9',
            '@react-native-community/cli-platform-ios': '13.6.9'
          });
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cd "$RUNNER_TEMP/RimSocial"
          npm install --no-audit --no-fund
      - name: Apply App Store metadata to generated Xcode settings
        run: |
          python3 - <<'PY'
          import json, pathlib, os, re
          config = json.loads(pathlib.Path('mobile/app.json').read_text())
          ios = config['ios']
          assert ios.get('supportsTablet') is True, 'iPad support must remain enabled'
          assert ios.get('bundleIdentifier') == 'com.clipverse.app', 'Unexpected iOS bundle identifier'
          ios_root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'RimSocial/ios'
          projects = list(ios_root.rglob('*.xcodeproj'))
          assert projects, 'Generated iOS Xcode project not found'
          project_path = projects[0] / 'project.pbxproj'
          project = project_path.read_text()
          project = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.clipverse.app;', project)
          assert 'PRODUCT_BUNDLE_IDENTIFIER = com.clipverse.app;' in project, 'iOS bundle identifier mismatch'
          assert 'GENERATE_INFOPLIST_FILE = YES;' in project, 'Expected Xcode-generated Info.plist settings'
          settings = {
              'NSCameraUsageDescription': ios['infoPlist']['NSCameraUsageDescription'],
              'NSMicrophoneUsageDescription': ios['infoPlist']['NSMicrophoneUsageDescription'],
              'NSPhotoLibraryUsageDescription': ios['infoPlist']['NSPhotoLibraryUsageDescription'],
              'NSPhotoLibraryAddUsageDescription': ios['infoPlist']['NSPhotoLibraryAddUsageDescription'],
              'ITSAppUsesNonExemptEncryption': 'NO',
          }
          lines = []
          for line in project.splitlines():
              lines.append(line)
              if 'GENERATE_INFOPLIST_FILE = YES;' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  for key, value in settings.items():
                      escaped = value.replace('\\', '\\\\').replace('"', '\\"')
                      lines.append(f'{indent}INFOPLIST_KEY_{key} = "{escaped}";' if key != 'ITSAppUsesNonExemptEncryption' else f'{indent}INFOPLIST_KEY_{key} = {value};')
          project = '\n'.join(lines) + '\n'
          project = project.replace('TARGETED_DEVICE_FAMILY = "1";', 'TARGETED_DEVICE_FAMILY = "1,2";')
          assert 'TARGETED_DEVICE_FAMILY = "1,2";' in project, 'Generated target must include iPhone and iPad'
          project_path.write_text(project)
          PY
      - name: Install CocoaPods
        run: cd "$RUNNER_TEMP/RimSocial/ios" && pod install
      - name: Build unsigned iOS simulator app
        run: |
          cd "$RUNNER_TEMP/RimSocial/ios"
          xcodebuild -workspace RimSocial.xcworkspace -scheme RimSocial -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
