name: Build RimSocial Android app
# Builds an installable debug APK from the latest main-branch frontend, so the native app
# gets every change the website gets. Download it from the run's "Artifacts" section.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app and sync it into the Android project
        run: npm run mobile:sync --workspace=clipverse-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://clipverse-backend-production.up.railway.app' }}

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          # Downloads can time out now and then, so the build is tried up to three times
          for attempt in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle attempt $attempt failed"
            sleep 20
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rimsocial-android-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
